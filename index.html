<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5ec1e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.png">
<title>Territory Trails 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body {
    font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none;
    background:#5ec1e8; color:#243; font-weight:700;
  }
  #gl, #gl canvas { position:fixed; inset:0; z-index:0; }
  .screen { position:fixed; inset:0; display:none; z-index:10; }
  .screen.on { display:block; }

  /* ---------- buttons / pills ---------- */
  button { font-family:inherit; font-weight:800; border:none; cursor:pointer; }
  .pill {
    background:rgba(20,40,70,0.55); color:#fff; border-radius:999px;
    padding:8px 14px; font-size:15px; backdrop-filter:blur(4px);
    display:inline-flex; align-items:center; gap:6px;
  }
  .iconbtn {
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.92);
    font-size:20px; box-shadow:0 3px 0 rgba(0,0,0,0.18); display:inline-flex;
    align-items:center; justify-content:center;
  }
  .iconbtn:active { transform:translateY(2px); box-shadow:none; }
  .bigbtn {
    border-radius:999px; padding:14px 26px; font-size:17px; color:#fff;
    background:linear-gradient(180deg,#69b7ff,#2f8fe8); box-shadow:0 4px 0 #1b6cb5;
    letter-spacing:0.5px;
  }
  .bigbtn:active { transform:translateY(3px); box-shadow:none; }
  .bigbtn.play { background:linear-gradient(180deg,#8ef07e,#3ecb4f); box-shadow:0 5px 0 #27963a; font-size:22px; padding:16px 44px; }
  .bigbtn.skins { background:linear-gradient(180deg,#c78bff,#9a55e8); box-shadow:0 4px 0 #6f31b5; }
  .bigbtn.danger { background:linear-gradient(180deg,#ff8a8a,#e84545); box-shadow:0 4px 0 #a92626; margin-top:14px; }
  .bigbtn.close { background:linear-gradient(180deg,#bbb,#888); box-shadow:0 4px 0 #555; margin-top:16px; width:100%; }
  .bigbtn.claim { padding:8px 14px; font-size:13px; }
  .bigbtn.claim:disabled { background:#ccc; box-shadow:0 3px 0 #999; color:#777; }
  .bigbtn.claim.glow { animation:glowP 1s infinite alternate; }
  @keyframes glowP { from{filter:brightness(1)} to{filter:brightness(1.35)} }
  .pulse { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

  /* ---------- menu ---------- */
  #menu { display:none; flex-direction:column; justify-content:space-between; padding:14px; z-index:20; }
  #menu.on { display:flex; }
  .topbar { display:flex; gap:10px; align-items:center; }
  .spacer { flex:1; }
  .menuMid { text-align:center; pointer-events:none; }
  .title {
    font-size:44px; line-height:1.02; color:#fff; letter-spacing:1px;
    text-shadow:0 4px 0 rgba(0,60,120,0.35), 0 8px 24px rgba(0,0,0,0.25);
    font-weight:900;
  }
  .title span { color:#ffd93d; }
  .bestCard {
    pointer-events:auto; margin:16px auto 0; max-width:330px; background:rgba(255,255,255,0.92);
    border-radius:18px; padding:12px 16px; box-shadow:0 6px 18px rgba(0,40,80,0.25);
  }
  .lvlName { font-size:15px; color:#2668a8; }
  .lvlTarget { font-size:13px; color:#689; margin:2px 0 8px; }
  .bar { position:relative; height:14px; background:#e3ecf5; border-radius:999px; overflow:hidden; }
  .bar .fill { height:100%; background:linear-gradient(90deg,#7ed957,#3ecb4f); border-radius:999px; transition:width .3s; }
  .bar .mark { position:absolute; top:-2px; width:3px; height:18px; background:#2668a8; }
  .bestTxt { font-size:13px; color:#47a; margin-top:6px; text-align:right; }
  .worldRow, .levelRow { display:flex; gap:8px; overflow-x:auto; padding:6px 2px; scrollbar-width:none; }
  .worldRow::-webkit-scrollbar, .levelRow::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; background:rgba(255,255,255,0.9); border-radius:999px; padding:9px 14px;
    font-size:13px; color:#345; box-shadow:0 3px 0 rgba(0,0,0,0.12);
  }
  .chip.sel { background:linear-gradient(180deg,#69b7ff,#2f8fe8); color:#fff; box-shadow:0 3px 0 #1b6cb5; }
  .chip.lock { opacity:0.55; filter:grayscale(0.6); }
  .chip.level { text-align:center; min-width:52px; }
  .chip.level b { display:block; font-size:16px; }
  .chip.level span { font-size:10px; color:#e8a400; letter-spacing:1px; }
  .menuBottom { display:flex; gap:12px; justify-content:center; align-items:center; padding-bottom:8px; }

  /* ---------- sheets ---------- */
  .sheet { position:fixed; inset:0; background:rgba(10,25,50,0.5); display:none; z-index:40; align-items:center; justify-content:center; }
  .sheet.on { display:flex; }
  .sheetCard { background:#fff; width:min(92vw,430px); max-height:82vh; border-radius:24px; padding:20px; display:flex; flex-direction:column; }
  .sheetCard h2 { text-align:center; color:#2668a8; letter-spacing:2px; margin-bottom:12px; }
  .sheetBody { overflow-y:auto; }
  .skinGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .skinCard { background:#f2f7fd; border-radius:14px; padding:10px 6px; text-align:center; border:3px solid transparent; }
  .skinCard.sel { border-color:#2f8fe8; background:#e3f1ff; }
  .skinPrev { width:58px; height:58px; border-radius:14px; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:inset 0 -6px 0 rgba(0,0,0,0.15); }
  .skinName { font-size:12px; color:#345; }
  .skinCost { font-size:11px; color:#e8a400; margin-top:2px; }
  .setRow { display:flex; justify-content:space-between; align-items:center; padding:10px 2px; font-size:15px; color:#345; border-bottom:1px solid #eef3f9; }
  .setRow input[type=range] { width:50%; }
  .setRow input[type=checkbox] { width:26px; height:26px; accent-color:#2f8fe8; }
  .missionRow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid #eef3f9; font-size:14px; color:#345; }
  .mProg { color:#8ab; font-size:12px; }

  /* ---------- HUD ---------- */
  #hud { z-index:10; }
  .hudTop { position:absolute; top:10px; left:10px; right:10px; display:flex; gap:8px; align-items:flex-start; z-index:10; pointer-events:none; }
  .hudTop > * { pointer-events:auto; }
  .hudLeft { display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .hudCenter { flex:1; text-align:center; pointer-events:none; }
  .pctBig { font-size:30px; color:#fff; text-shadow:0 3px 0 rgba(0,60,120,0.4); }
  .hudCenter .bar { max-width:230px; margin:4px auto; background:rgba(255,255,255,0.5); }
  .tiny { font-size:11px; color:rgba(255,255,255,0.9); text-shadow:0 1px 2px rgba(0,0,0,0.3); }
  .hudRight { display:flex; flex-direction:column; gap:6px; align-items:flex-end; min-width:150px; pointer-events:none; }
  .lbRow { color:#fff; border-radius:999px; padding:6px 12px; font-size:13px; box-shadow:0 2px 6px rgba(0,0,0,0.2); white-space:nowrap; }
  .lbRow.me { outline:3px solid rgba(255,255,255,0.8); }
  .hudBottom { position:absolute; left:12px; right:12px; bottom:14px; display:flex; justify-content:space-between; align-items:flex-end; z-index:10; pointer-events:none; }
  #minimap { width:120px; height:120px; opacity:0.95; }
  .powerChips { font-size:26px; text-shadow:0 2px 6px rgba(0,0,0,0.35); min-height:30px; }

  /* joystick */
  #touchLayer { position:absolute; inset:0; z-index:5; touch-action:none; }
  .joyBase {
    position:fixed; width:118px; height:118px; margin:-59px 0 0 -59px; border-radius:50%;
    background:rgba(255,255,255,0.18); border:3px solid rgba(255,255,255,0.4);
    display:none; z-index:4; pointer-events:none;
  }
  .joyBase.on { display:block; }
  .joyKnob { width:54px; height:54px; margin:29px 0 0 29px; border-radius:50%; background:rgba(255,255,255,0.85); box-shadow:0 3px 8px rgba(0,0,0,0.3); }

  .newBest {
    position:fixed; top:26%; left:0; right:0; text-align:center; z-index:20;
    font-size:44px; font-weight:900; color:#ffd93d; letter-spacing:2px;
    text-shadow:0 4px 0 #c77800, 0 8px 24px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
  }
  .newBest.on { animation:nb 2.2s ease forwards; }
  @keyframes nb {
    0% { opacity:0; transform:scale(0.3); }
    15% { opacity:1; transform:scale(1.25); }
    30% { transform:scale(1); }
    80% { opacity:1; }
    100% { opacity:0; transform:scale(1.05) translateY(-30px); }
  }

  /* ---------- overlays ---------- */
  .overlay { background:rgba(10,25,50,0.55); display:none; align-items:center; justify-content:center; z-index:50; }
  .overlay.on { display:flex; }
  .card { background:#fff; border-radius:26px; padding:26px 30px; width:min(88vw,360px); text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  .card h2 { color:#2668a8; letter-spacing:2px; margin-bottom:14px; font-size:26px; }
  .card .bigbtn { width:100%; margin-top:10px; }
  .rStars { font-size:52px; letter-spacing:6px; margin:6px 0 12px; }
  .star { color:#d7e0ea; display:inline-block; }
  .star.got { color:#ffd93d; text-shadow:0 3px 0 #c77800; animation:starPop .5s backwards; }
  @keyframes starPop { 0%{transform:scale(0) rotate(-180deg)} 70%{transform:scale(1.4)} 100%{transform:scale(1)} }
  .rStats { margin-bottom:8px; }
  .rRow { display:flex; justify-content:space-between; font-size:15px; color:#567; padding:5px 2px; border-bottom:1px dashed #e3ecf5; }
  .rRow b { color:#234; }

  /* ---------- toasts & confetti ---------- */
  .toasts { position:fixed; top:12%; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none; }
  .toast { background:rgba(20,40,70,0.85); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; animation:tIn .3s; }
  .toast.bye { opacity:0; transition:opacity .5s; }
  @keyframes tIn { from{transform:translateY(-14px); opacity:0} }
  .confetti { position:fixed; top:-24px; width:10px; height:15px; z-index:70; border-radius:2px; animation:fall 2.4s linear forwards; pointer-events:none; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }

  /* ---------- vector icons ---------- */
  .ic { width:1.05em; height:1.05em; vertical-align:-0.18em; fill:currentColor; display:inline-block; }
  .gold { color:#ffd23a; } .red { color:#ff6b6b; } .cyan { color:#4dc3ff; } .purple { color:#c46bff; }
  .dim { color:rgba(70,90,120,.6); } .dimw { color:#cfe3ff; }
  .sm { width:.85em; height:.85em; }
  .st { width:11px; height:11px; color:#b9c6d6; }
  .st.on { color:#ffb400; }
  .stRow { display:flex; gap:2px; justify-content:center; margin-top:2px; }
  .skinIc { width:34px; height:34px; color:#fff; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .bigStar { width:52px; height:52px; color:#d7e0ea; }
  .starSlot { display:inline-block; margin:0 3px; animation:starPop .55s backwards; }
  .starSlot.got .bigStar { color:#ffd93d; filter:drop-shadow(0 3px 0 #c77800); }
  .bigStar.red { color:#ff6b6b; filter:none; }
  .iconbtn svg { width:22px; height:22px; color:#2668a8; }
  .toast .ic { width:1em; height:1em; }
  .powerChips .ic { width:30px; height:30px; margin-left:6px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }

  /* ---------- motion polish ---------- */
  .screen.on { animation:scrIn .35s ease; }
  @keyframes scrIn { from { opacity:0; } }
  .card { animation:cardIn .45s cubic-bezier(.2,1.4,.4,1); }
  .sheetCard { animation:cardIn .35s cubic-bezier(.2,1.2,.4,1); }
  @keyframes cardIn { from { transform:scale(.72) translateY(30px); opacity:0; } }
  .title { animation:floaty 4s ease-in-out infinite alternate; }
  @keyframes floaty { to { transform:translateY(-8px); } }
  .bestCard { animation:upIn .5s .05s backwards; }
  .worldRow { animation:upIn .5s .12s backwards; }
  .levelRow { animation:upIn .5s .18s backwards; }
  .menuBottom { animation:upIn .5s .24s backwards; }
  @keyframes upIn { from { opacity:0; transform:translateY(16px); } }
  .chip { transition:transform .15s, background .2s, box-shadow .2s; }
  .chip:active { transform:scale(.92); }
  .lbRow { transition:background .4s; }
  .bump { animation:bump .3s; }
  @keyframes bump { 30% { transform:scale(1.18); } }
  .bar .fill { position:relative; overflow:hidden; }
  .bar .fill::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:translateX(-100%); animation:sheen 2.2s infinite; }
  @keyframes sheen { 60%,100% { transform:translateX(100%); } }
  .joyBase:not(.on) .joyKnob { transition:transform .18s; }
  .bigbtn svg { width:1.1em; height:1.1em; }

  /* ---------- level select (stacked cards) ---------- */
  .tag { margin-top:10px; color:rgba(255,255,255,.85); letter-spacing:4px; font-size:13px; text-shadow:0 2px 6px rgba(0,40,80,.3); }
  #levels { z-index:20; }
  #levels.on { display:block; }
  #levels .topbar { position:absolute; top:0; left:0; right:0; padding:12px 14px; display:flex; gap:10px; align-items:center; }
  .worldWrap { position:absolute; top:66px; left:0; right:0; padding:0 12px; }
  .lvlStack {
    position:absolute; top:120px; bottom:0; left:0; right:0;
    overflow-y:auto; padding:8px 16px 34px;
    display:flex; flex-direction:column; gap:12px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .lvlStack::-webkit-scrollbar { display:none; }
  .lvlCard {
    display:flex; align-items:center; gap:12px; text-align:left;
    background:rgba(255,255,255,.95); border-radius:20px; padding:13px 15px;
    box-shadow:0 5px 0 rgba(0,40,80,.14), 0 10px 24px rgba(0,40,80,.12);
    animation:upIn .45s backwards; transition:transform .15s;
  }
  .lvlCard:active { transform:scale(.97); }
  .lvlCard.lock { opacity:.62; filter:grayscale(.65); }
  .lcNum {
    width:48px; height:48px; border-radius:16px; flex:0 0 auto;
    background:linear-gradient(180deg,#69b7ff,#2f8fe8); color:#fff;
    font-size:21px; font-weight:900; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);
  }
  .lcInfo { flex:1; min-width:0; }
  .lcName { font-size:16px; color:#223a55; letter-spacing:.5px; }
  .lcMeta { font-size:11px; color:#7a93ad; margin-top:2px; letter-spacing:.4px; }
  .lcStars { margin-top:5px; display:flex; gap:3px; }
  .lcStars .st { width:15px; height:15px; }
  .lcRight { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
  .lcBest { font-size:11px; color:#3f7ab8; }
  .lcPlay {
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(180deg,#8ef07e,#3ecb4f); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 #27963a;
  }
  .lcPlay svg { width:18px; height:18px; margin-left:2px; }
  .bigLock { width:26px; height:26px; }
</style>
</head>
<body>
<div id="gl"></div>
<script src="js/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/logic.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/world3d.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
